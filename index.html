<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Discovery Labs Innsbruck</title>
<meta name="description" content="Materialien und digitale Werkzeuge für Lernlabore in Innsbruck.">
<style>
  :root{--bg:#f5f8fb;--card:#ffffff;--ink:#14212b;--muted:#5b6b78;--line:#cfdbe5;--accent:#2E74B5;--accent-ink:#1F3A5F}
  @media (prefers-color-scheme:dark){:root{--bg:#10181f;--card:#18232d;--ink:#e6edf3;--muted:#9fb0bf;--line:#2c3b48;--accent:#6fb1e8;--accent-ink:#cfe6fa}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.55 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
  main{max-width:720px;margin:0 auto;padding:32px 16px 48px}
  h1{margin:0 0 4px;font-size:clamp(1.8rem,5vw,2.4rem);line-height:1.15;color:var(--accent-ink);text-wrap:balance}
  .sub{margin:0 0 28px;color:var(--muted)}
  .back{display:inline-block;margin-bottom:18px;color:var(--accent);text-decoration:none;font-size:16px}
  .back:hover{text-decoration:underline}
  h2{margin:32px 0 10px;font-size:1.05rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
  a.card{display:block;padding:16px 18px;margin-bottom:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;
         color:inherit;text-decoration:none}
  a.card:hover,a.card:focus-visible{border-color:var(--accent);outline:none}
  a.card strong{display:block;font-size:1.15rem;color:var(--accent-ink)}
  a.card span{display:block;color:var(--muted);font-size:16px}
  a.card em{display:block;margin-top:6px;font-style:normal;color:var(--accent);font-size:16px}
  footer{margin-top:40px;color:var(--muted);font-size:14px}
</style>
</head>
<body>
<main>
<h1>Discovery Labs Innsbruck</h1>
<p class="sub">Materialien und digitale Werkzeuge für Lernlabore in Innsbruck.</p>
<h2>Labore</h2>
<a class="card" href="quantumcrypto/">
  <strong>Quantenkryptografie</strong>
  <span>Von der klassischen Verschlüsselung zum Quantenschlüsselaustausch (BB84).</span>
  <em>Zum Labor →</em>
</a>
</main>
</body>
</html>
